aid: polytomic
name: Polytomic
description: >-
  Polytomic is a data integration platform providing no-code data syncing between databases, data warehouses, and SaaS
  applications. The Polytomic REST API exposes connections, syncs, models, bulk syncs, identity, schemas, and webhooks
  for programmatic management of data movement.
