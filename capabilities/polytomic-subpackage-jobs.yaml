naftiko: 1.0.0-alpha2
info:
  label: API Reference — subpackage_jobs
  description: 'API Reference — subpackage_jobs. 1 operations. Lead operation: Get Job. Self-contained Naftiko capability
    covering one Polytomic business surface.'
  tags:
  - Polytomic
  - subpackage_jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    POLYTOMIC_API_KEY: POLYTOMIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: polytomic-subpackage-jobs
    baseUri: https://app.polytomic.com
    description: API Reference — subpackage_jobs business capability. Self-contained, no shared references.
    resources:
    - name: api-jobs-type-id
      path: /api/jobs/{type}/{id}
      operations:
      - name: get
        method: GET
        description: Get Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Unique identifier of the job (usually returned by whichever endpoint started the job).
          required: true
        - name: type
          in: path
          type: string
          description: 'Job type. One of: createmodel, updatemodel, previewmodel, samplemodel, exportlogs.'
          required: true
        - name: Authorization
          in: header
          type: string
          description: Bearer user API key
          required: true
        - name: X-Polytomic-Version
          in: header
          type: string
    authentication:
      type: bearer
      token: '{{env.POLYTOMIC_API_KEY}}'
  exposes:
  - type: rest
    namespace: polytomic-subpackage-jobs-rest
    port: 8080
    description: REST adapter for API Reference — subpackage_jobs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/jobs/{type}/{id}
      name: api-jobs-type-id
      description: REST surface for api-jobs-type-id.
      operations:
      - method: GET
        name: get
        description: Get Job
        call: polytomic-subpackage-jobs.get
        with:
          id: rest.id
          type: rest.type
          Authorization: rest.Authorization
          X-Polytomic-Version: rest.X-Polytomic-Version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: polytomic-subpackage-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for API Reference — subpackage_jobs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-job
      description: Get Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: polytomic-subpackage-jobs.get
      with:
        id: tools.id
        type: tools.type
        Authorization: tools.Authorization
        X-Polytomic-Version: tools.X-Polytomic-Version
      outputParameters:
      - type: object
        mapping: $.
